name: HomeCore build and quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up quality tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-quality.txt

      - name: Check formatting, headers, and host tests
        run: .venv/bin/python scripts/check_quality.py --checks format headers host --verbose --timeout 300

  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The theme and G2Basic (with its own theme) are needed, not CMSIS.
      - name: Fetch documentation submodules
        run: |
          git submodule update --init --depth 1 external/doxygen-awesome-css external/g2basic
          git -C external/g2basic submodule update --init --depth 1 external/doxygen-awesome-css

      # PyYAML lets scripts/bindings_doc.py generate the binding reference.
      - name: Install Doxygen, Graphviz, and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-yaml

      # Builds the G2Basic reference into build/docs/g2basic, then HomeCore's,
      # linked through a tag file. Both Doxyfiles set WARN_AS_ERROR, and page
      # headers show each project() version plus its short commit.
      - name: Generate API documentation
        run: bash scripts/build_docs.sh

      # Uploaded on every run so pull requests can download a preview;
      # deploy-docs publishes it only for pushes to the default branch.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

  deploy-docs:
    name: Publish API documentation
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one commit at a time; never cancel a deployment in progress.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build:
    name: Build ${{ matrix.target }} (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [lm3s6965evb, stm32f4discovery, stm32vldiscovery, stm32vldiscovery-qemu]
        build_type: [Debug, Release]
        # Board, optional device-description overlay, and QEMU test board.
        include:
          - target: lm3s6965evb
            board: lm3s6965evb
            qemu_board: lm3s6965evb
          - target: stm32f4discovery
            board: stm32f4discovery
          - target: stm32vldiscovery
            board: stm32vldiscovery
          - target: stm32vldiscovery-qemu
            board: stm32vldiscovery
            overlay: src/board/stm32vldiscovery/qemu.yaml
            qemu_board: stm32vldiscovery
    env:
      TARGET_BOARD: ${{ matrix.board }}
      TARGET_OVERLAY: ${{ matrix.overlay }}
      BUILD_TYPE: ${{ matrix.build_type }}
      BUILD_DIR: build/ci/${{ matrix.target }}/${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi qemu-system-arm python3 python3-venv python3-pip

      - name: Set up build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Configure firmware
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi.cmake" \
            -DHOMECORE_BOARD="$TARGET_BOARD" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            ${TARGET_OVERLAY:+-DHOMECORE_DT_OVERLAYS="$PWD/$TARGET_OVERLAY"} \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build firmware
        run: cmake --build "$BUILD_DIR" --verbose

      - name: Report firmware size
        run: arm-none-eabi-size "$BUILD_DIR/homecore"

      - name: Test firmware in QEMU
        if: matrix.qemu_board != ''
        timeout-minutes: 3
        run: |
          .venv/bin/python tests/qemu_files_test.py \
            --board "${{ matrix.qemu_board }}" --firmware "$BUILD_DIR/homecore"
          .venv/bin/python tests/qemu_docs_test.py \
            --board "${{ matrix.qemu_board }}" --firmware "$BUILD_DIR/homecore"
