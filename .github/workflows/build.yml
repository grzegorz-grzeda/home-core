name: HomeCore build and quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up quality tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-quality.txt

      - name: Check formatting, headers, and host tests
        run: .venv/bin/python scripts/check_quality.py --checks format headers host --verbose --timeout 300

  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # The Doxyfile sets WARN_AS_ERROR = FAIL_ON_WARNINGS.
      - name: Generate API documentation
        run: doxygen Doxyfile

      # Uploaded on every run so pull requests can download a preview;
      # deploy-docs publishes it only for pushes to the default branch.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy-docs:
    name: Publish API documentation
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one commit at a time; never cancel a deployment in progress.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build:
    name: Build ${{ matrix.board }} (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [lm3s6965evb, stm32f4discovery]
        build_type: [Debug, Release]
    env:
      TARGET_BOARD: ${{ matrix.board }}
      BUILD_TYPE: ${{ matrix.build_type }}
      BUILD_DIR: build/ci/${{ matrix.board }}/${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi qemu-system-arm python3 python3-venv python3-pip

      - name: Set up build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Configure firmware
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi.cmake" \
            -DHOMECORE_BOARD="$TARGET_BOARD" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DHOMECORE_DEFCONFIG="$PWD/configs/homecore_defconfig" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build firmware
        run: cmake --build "$BUILD_DIR" --verbose

      - name: Report firmware size
        run: arm-none-eabi-size "$BUILD_DIR/homecore"

      - name: Test firmware in QEMU
        if: matrix.board == 'lm3s6965evb'
        timeout-minutes: 2
        run: .venv/bin/python tests/qemu_files_test.py --firmware "$BUILD_DIR/homecore"
