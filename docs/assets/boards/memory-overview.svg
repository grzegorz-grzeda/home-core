<svg xmlns="http://www.w3.org/2000/svg" class="hc-diagram" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="memory-overview-title memory-overview-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="memory-overview-title">Flash and RAM by board</title>
