# LM3S6965EVB in QEMU. The clock is QEMU's reset configuration (200 MHz / 16).
name: LM3S6965EVB
soc: ti/lm3s6965
clocks: {cpu: 12500000}
devices:
  uart0: {status: okay}
  uart1: {status: okay}
  uart2: {status: okay}
  # 32 KB of the 64 KB SRAM as a littlefs disk, formatted at every boot.
  # FAT cannot be used: FatFs needs at least 64 KB.
  ram0: {compatible: "homecore,ramdisk", size: 32K}
  # QEMU's machine has no LED (the physical board's status LED on PF0 is not
  # supported): report LED changes on the console instead.
  led0: {compatible: "homecore,console-led"}
mounts:
  /ram: {device: ram0, fs: littlefs, format: true}
chosen: {console: uart0}
