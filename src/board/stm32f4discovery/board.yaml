# STM32F4DISCOVERY: 16 MHz HSI with undivided AHB/APB clocks (see board.c).
name: STM32F4DISCOVERY
soc: st/stm32f407
clocks: {cpu: 16000000, apb1: 16000000, apb2: 16000000}
devices:
  # PA2/PA3; board.c enables the clock and pins. Keeps the /dev/uart0 name.
  usart2: {status: okay, baud: 115200, devname: uart0}
  # 64 KB of the 128 KB main SRAM as a FAT disk, formatted at every boot.
  ram0: {compatible: "homecore,ramdisk", size: 64K}
  # 16 KB littlefs disk, formatted at every boot.
  ram1: {compatible: "homecore,ramdisk", size: 16K}
  # User LEDs on PD12-PD15, lit when the pin is high (UM1472).
  gpiod: {status: okay}
  led0: {compatible: "homecore,gpio-led", gpio: gpiod, pin: 12}  # LD4 green
  led1: {compatible: "homecore,gpio-led", gpio: gpiod, pin: 13}  # LD3 orange
  led2: {compatible: "homecore,gpio-led", gpio: gpiod, pin: 14}  # LD5 red
  led3: {compatible: "homecore,gpio-led", gpio: gpiod, pin: 15}  # LD6 blue
mounts:
  /ram: {device: ram0, fs: fat, format: true}
  /lfs: {device: ram1, fs: littlefs, format: true}
chosen: {console: usart2}
