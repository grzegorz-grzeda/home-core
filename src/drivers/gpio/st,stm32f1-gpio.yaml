# Binding for STM32F1 GPIO ports.
compatible: st,stm32f1-gpio
description: STM32F1 GPIO port with 16 pins; the driver enables the port clock.
driver: stm32f1_gpio
sources: [stm32f1_gpio.c]
gpio: true
properties:
  reg:
    type: int
    required: true
    unique: true
    field: base
    description: Register block address.
  clock-bit:
    type: int
    required: true
    maximum: 31
    field: clock_bit
    description: The port's enable bit in RCC_APB2ENR (IOPAEN, GPIOA, is 2).
