# Binding for Stellaris (LM3S) UARTs with interrupt-driven receive.
compatible: ti,stellaris-uart
description: Stellaris UART, interrupt-driven receive, polled transmit, reset line configuration (QEMU).
driver: stellaris_uart
sources: [stellaris_uart.c]
console: true
isr: true
properties:
  reg:
    type: int
    required: true
    field: base
    unique: true
    description: Register block address.
  irq:
    type: int
    required: true
    unique: true
    field: irq
    description: NVIC interrupt number of the receive interrupt.
  devname:
    type: devpath
    field: path
    description: VFS name under /dev; defaults to the node name.
