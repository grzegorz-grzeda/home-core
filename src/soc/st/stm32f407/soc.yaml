# STM32F407: memory and peripherals, all disabled until a board enables them.
# The 64 KB CCM RAM is a separate bank and is not described yet.
memory:
  flash: {base: 0x08000000, size: 1024K}
  ram: {base: 0x20000000, size: 128K}
devices:
  usart1: {compatible: "st,stm32-usart", reg: 0x40011000, irq: 37, bus: apb2, status: disabled}
  usart2: {compatible: "st,stm32-usart", reg: 0x40004400, irq: 38, bus: apb1, status: disabled}
  usart3: {compatible: "st,stm32-usart", reg: 0x40004800, irq: 39, bus: apb1, status: disabled}
