# LM3S6965: memory and peripherals, all disabled until a board enables them.
arch: arm/cortex-m3
memory:
  flash: {base: 0x00000000, size: 256K}
  ram: {base: 0x20000000, size: 64K}
devices:
  uart0: {compatible: "ti,stellaris-uart", reg: 0x4000C000, irq: 5, status: disabled}
  uart1: {compatible: "ti,stellaris-uart", reg: 0x4000D000, irq: 6, status: disabled}
  uart2: {compatible: "ti,stellaris-uart", reg: 0x4000E000, irq: 33, status: disabled}
